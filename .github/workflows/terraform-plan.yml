name: "Terraform Plan"

on:
  pull_request:
    branches:
      - main
      - master
      - dev
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Determine Environment"
        id: env
        run: |
          if [ "${{ github.base_ref }}" = "main" ] || [ "${{ github.base_ref }}" = "master" ]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
            echo "target_env=production" >> $GITHUB_OUTPUT
          else
            echo "env_name=dev" >> $GITHUB_OUTPUT
            echo "target_env=staging" >> $GITHUB_OUTPUT
          fi

      - name: "Authenticate to Google Cloud via WIF"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: "Check Terraform Format"
        id: fmt
        run: |
          cd terraform
          terraform fmt -check -recursive

      - name: "Initialize Terraform"
        id: init
        run: |
          cd terraform
          terraform init -input=false -reconfigure -backend-config="backends/${{ steps.env.outputs.env_name }}.hcl"

      - name: "Terraform Plan"
        id: plan
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_project_number: ${{ secrets.GCP_PROJECT_NUMBER }}
        run: |
          cd terraform
          terraform plan -input=false -no-color -var-file="envs/${{ steps.env.outputs.env_name }}.tfvars" -out=tfplan

      - name: "Post Plan Summary to Pull Request"
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Terraform Format and Style: \`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization: \`${{ steps.init.outcome }}\`
            #### Target Environment: \`${{ steps.env.outputs.target_env }}\` (\`${{ steps.env.outputs.env_name }}\`)
            #### Terraform Plan: \`${{ steps.plan.outcome }}\`

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
